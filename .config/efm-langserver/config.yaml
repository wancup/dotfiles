# yaml-language-server: $schema=https://raw.githubusercontent.com/mattn/efm-langserver/master/schema.json

version: 2
lint-debounce: 1s
format-debounce: 0.5s
provide-definition: false

root-markers:
  - .git/

tools:
  any-typos: &any-typos
    lint-source: typos
    lint-command: "typos - --format brief"
    lint-ignore-exit-code: true
    lint-stdin: true
    lint-severity: 3
    lint-formats:
      - "-:%l:%c: error: %m"

  fish-fish: &fish-fish
    lint-source: fish
    lint-command: "fish --no-execute /dev/stdin"
    lint-stdin: true
    lint-ignore-exit-code: true
    lint-after-open: true
    lint-formats:
      - "%E/dev/stdin (line %l): %m"
      - "%C%p^"
      - "%C%.%#"

  dockerfile-hadolint: &dockerfile-hadolint
    lint-source: hadolint
    lint-command: "hadolint --no-color -"
    lint-stdin: true
    lint-ignore-exit-code: true
    lint-after-open: true
    lint-category-map:
      s: N
    lint-formats:
      - "%f:%l DL%n %t%*[^:]: %m"
      - "%f:%l SC%n %t%*[^:]: %m"

  go-golangci-lint: &go-golangci-lint
    lint-source: golangci-lint
    lint-command: >-
      golangci-lint run --path-mode=abs --show-stats=false
      --output.text.path=stdout --output.text.colors=false --output.text.print-issued-lines=false ./...
    root-markers:
      - go.mod
    require-marker: true
    lint-workspace: true
    lint-ignore-exit-code: true
    lint-after-open: true
    lint-severity: 2
    lint-formats:
      - "%f:%l:%c: %m"
      - "%f:%l: %m"

  yaml-actionlint: &yaml-actionlint
    lint-source: actionlint
    lint-command: "actionlint -no-color -oneline -"
    lint-stdin: true
    lint-ignore-exit-code: true
    lint-after-open: true
    lint-severity: 2
    lint-formats:
      - "%f:%l:%c: %m"

  yaml-ghalint: &yaml-ghalint
    lint-source: ghalint
    lint-command: "ghalint --log-color never run"
    lint-stdin: false
    lint-ignore-exit-code: true
    lint-after-open: true
    lint-on-save: true
    lint-formats:
      - '%E%.%# ERR %.%# reference=%*\S %m'
      - "%E%.%# ERR %m"

languages:
  =:
    - <<: *any-typos
  fish:
    - <<: *fish-fish
  dockerfile:
    - <<: *dockerfile-hadolint
  go:
    - <<: *go-golangci-lint
  yaml.gha:
    - <<: *yaml-actionlint
    - <<: *yaml-ghalint
