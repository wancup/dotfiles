name: autofix.ci

on:
  pull_request:
    paths:
      - .config/aquaproj-aqua/aqua.yaml
      - .config/aquaproj-aqua/aqua-checksums.json

permissions: {}

jobs:
  autofix:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .config/aquaproj-aqua
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - uses: aquaproj/aqua-installer@82d0e83878a8657c4a6f2ff1755d3bfbfc67f329 # v4.1.0
        with:
          aqua_version: v2.63.0
          working_directory: .config/aquaproj-aqua
        env:
          AQUA_CONFIG: aqua.yaml
          AQUA_LOG_LEVEL: info

      - run: aqua update-checksum --prune

      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
