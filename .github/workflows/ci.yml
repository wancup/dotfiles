name: CI

on:
  push:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      AQUA_GLOBAL_CONFIG: .config/aquaproj-aqua/aqua.yaml

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: aquaproj/aqua-installer@v4.1.1
        with:
          aqua_version: v2.66.1
          aqua_opts: "-a -l"
        env:
          AQUA_CONFIG: .config/aquaproj-aqua/aqua.yaml
          AQUA_LOG_LEVEL: info

      - name: Install pnpm and Node.js
        uses: pnpm/setup@v3.2.0
        with:
          version: 12
          runtime: node@26
          cache: true
          install: false
          cache-dependency-path: |
            .pi/agent/exts/pnpm-lock.yaml
            npm/pnpm-lock.yaml

      - name: Install npm dependencies
        working-directory: npm
        run: pnpm ci

      - name: Install pi extension dependencies
        working-directory: .pi/agent/exts
        run: pnpm ci

      - name: Typecheck pi extensions
        working-directory: .pi/agent/exts
        run: pnpm run typecheck

      - name: Test pi extensions
        working-directory: .pi/agent/exts
        run: pnpm run test

      - name: Format Lua
        run: stylua --check --allow-hidden .

      - name: Format Others
        run: dprint check
